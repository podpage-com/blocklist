services:
  - type: web
    name: blocklist
    runtime: docker
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blocklist-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: blocklist.onrender.com
databases:
  - name: blocklist-db
    databaseName: blocklist
    user: blocklist
