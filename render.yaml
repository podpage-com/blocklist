services:
  - type: web
    name: blocklist
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn blocklist.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blocklist-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: blocklist
          property: host

databases:
  - name: blocklist-db
    plan: free
    region: oregon
    postgresMajorVersion: 18
